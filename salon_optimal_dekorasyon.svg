<svg width="100%" viewBox="0 0 760 760" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Salon optimal dekorasyon planı</title>
  <desc>3.16 x 8.33 m salon için modern sıcak dekorasyon yerleşimi: TV ünitesi, üçlü koltuk, puf, berjer, lambader, halı ve sehpa.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <pattern id="outside" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#b9b4a7" stroke-width="0.6" opacity="0.45"/>
    </pattern>
    <linearGradient id="rug" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#9b5f45"/>
      <stop offset="1" stop-color="#6f7f55"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="760" height="760" fill="#292826"/>
  <text x="380" y="30" text-anchor="middle" fill="#f7f1e6" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Salon optimal dekorasyon planı</text>
  <text x="380" y="51" text-anchor="middle" fill="#cfc7b8" font-family="Inter, Arial, sans-serif" font-size="12">Modern sıcak yerleşim - iki kardeş için TV, dinlenme ve rahat dolaşım</text>

  <!-- Fixed shell: scale is approximately 70 px = 1 m. -->
  <rect x="230" y="508" width="90" height="125" fill="url(#outside)" stroke="none"/>
  <text x="275" y="558" text-anchor="middle" fill="#b9b4a7" font-family="Inter, Arial, sans-serif" font-size="12" font-style="italic">Hol</text>
  <text x="275" y="575" text-anchor="middle" fill="#b9b4a7" font-family="Inter, Arial, sans-serif" font-size="12" font-style="italic">(salon dışı)</text>

  <line x1="230" y1="50" x2="451" y2="50" stroke="#f7f1e6" stroke-width="5"/>
  <line x1="232" y1="50" x2="449" y2="50" stroke="#30302e" stroke-width="1.5"/>
  <line x1="451" y1="50" x2="451" y2="633" stroke="#f7f1e6" stroke-width="5"/>
  <line x1="320" y1="633" x2="451" y2="633" stroke="#f7f1e6" stroke-width="5"/>
  <line x1="320" y1="508" x2="320" y2="633" stroke="#cfc7b8" stroke-width="1.5" stroke-dasharray="7,4"/>
  <line x1="230" y1="508" x2="320" y2="508" stroke="#f7f1e6" stroke-width="5"/>
  <line x1="230" y1="50" x2="230" y2="508" stroke="#f7f1e6" stroke-width="5"/>

  <text x="340" y="44" text-anchor="middle" fill="#cfc7b8" font-family="Inter, Arial, sans-serif" font-size="12">Cam / pencere</text>
  <text x="372" y="576" fill="#cfc7b8" font-family="Inter, Arial, sans-serif" font-size="12">Giriş: boş ve rahat geçiş</text>
  <line x1="345" y1="570" x2="368" y2="570" stroke="#cfc7b8" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Clear circulation zone. -->
  <rect x="309" y="120" width="84" height="410" fill="#5d7d72" opacity="0.14" rx="4"/>
  <text x="351" y="528" text-anchor="middle" fill="#9fb8ae" font-family="Inter, Arial, sans-serif" font-size="11">90 cm+ net geçiş</text>

  <!-- Rug and central living zone. -->
  <rect x="296" y="238" width="112" height="161" fill="url(#rug)" opacity="0.34" rx="4" filter="url(#softShadow)"/>
  <text x="352" y="260" text-anchor="middle" fill="#f7f1e6" font-family="Inter, Arial, sans-serif" font-size="11">Halı</text>
  <text x="352" y="276" text-anchor="middle" fill="#f7f1e6" font-family="Inter, Arial, sans-serif" font-size="11">160 x 230 cm</text>

  <!-- Sofa: compact three-seater. -->
  <rect x="230" y="232" width="68" height="168" fill="#8f9085" stroke="#4f514b" stroke-width="0.8" rx="4" filter="url(#softShadow)"/>
  <rect x="230" y="232" width="12" height="168" fill="#6f7168" rx="4"/>
  <rect x="230" y="232" width="68" height="8" fill="#6f7168" rx="4"/>
  <line x1="252" y1="247" x2="252" y2="386" stroke="#b7b8ad" stroke-width="0.8" opacity="0.6"/>
  <line x1="274" y1="247" x2="274" y2="386" stroke="#b7b8ad" stroke-width="0.8" opacity="0.6"/>
  <text x="264" y="315" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">3'lü koltuk</text>
  <text x="264" y="331" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="11">240 x 95 cm</text>

  <!-- Movable pouf instead of heavy chaise. -->
  <rect x="245" y="416" width="49" height="49" fill="#6f7f55" stroke="#39452d" stroke-width="0.8" rx="5" filter="url(#softShadow)"/>
  <text x="270" y="445" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="11">Puf</text>
  <text x="270" y="460" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="10">70 x 70</text>

  <!-- Coffee table: oval, narrow-safe. -->
  <ellipse cx="352" cy="326" rx="27" ry="18" fill="#b9895f" stroke="#5a3b24" stroke-width="0.8" filter="url(#softShadow)"/>
  <text x="352" y="330" text-anchor="middle" fill="#2f2118" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700">Oval sehpa</text>
  <text x="352" y="350" text-anchor="middle" fill="#cfc7b8" font-family="Inter, Arial, sans-serif" font-size="10">60-80 cm</text>

  <!-- TV wall: low closed unit and screen. -->
  <rect x="426" y="248" width="25" height="136" fill="#b9895f" stroke="#5a3b24" stroke-width="0.8" rx="2" filter="url(#softShadow)"/>
  <line x1="438.5" y1="254" x2="438.5" y2="378" stroke="#6d472b" stroke-width="0.7" opacity="0.7"/>
  <rect x="448" y="266" width="3" height="100" fill="#151515"/>
  <text x="462" y="314" fill="#f7f1e6" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">TV</text>
  <text x="462" y="330" fill="#cfc7b8" font-family="Inter, Arial, sans-serif" font-size="11">Alçak ünite</text>
  <text x="462" y="345" fill="#cfc7b8" font-family="Inter, Arial, sans-serif" font-size="11">180 x 35 cm</text>
  <rect x="431" y="205" width="14" height="70" fill="#9a6a45" opacity="0.65" rx="2"/>
  <rect x="431" y="390" width="14" height="70" fill="#9a6a45" opacity="0.65" rx="2"/>
  <text x="462" y="219" fill="#cfc7b8" font-family="Inter, Arial, sans-serif" font-size="10">ince raf</text>
  <text x="462" y="404" fill="#cfc7b8" font-family="Inter, Arial, sans-serif" font-size="10">ince raf</text>

  <!-- Reading corner near window. -->
  <g transform="rotate(-18, 371, 133)">
    <rect x="341" y="103" width="60" height="60" fill="#6f7f55" stroke="#39452d" stroke-width="0.8" rx="5" filter="url(#softShadow)"/>
    <rect x="341" y="103" width="60" height="10" fill="#4f623d" rx="5"/>
    <rect x="341" y="103" width="7" height="60" fill="#4f623d"/>
    <rect x="394" y="103" width="7" height="60" fill="#4f623d"/>
  </g>
  <text x="373" y="190" text-anchor="middle" fill="#cfc7b8" font-family="Inter, Arial, sans-serif" font-size="12">Berjer 80 x 80 cm</text>
  <circle cx="304" cy="130" r="15" fill="#f0d89c" stroke="#8a7a5a" stroke-width="0.8" filter="url(#softShadow)"/>
  <circle cx="304" cy="130" r="3" fill="#3a3a3a"/>
  <text x="294" y="158" text-anchor="end" fill="#cfc7b8" font-family="Inter, Arial, sans-serif" font-size="12">Lambader</text>
  <circle cx="325" cy="168" r="11" fill="#b9895f" stroke="#5a3b24" stroke-width="0.8"/>
  <text x="325" y="188" text-anchor="middle" fill="#cfc7b8" font-family="Inter, Arial, sans-serif" font-size="10">yan sehpa</text>

  <!-- Dimension guides. -->
  <line x1="230" y1="25" x2="451" y2="25" stroke="#cfc7b8" stroke-width="0.7" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="340" y="20" text-anchor="middle" fill="#cfc7b8" font-family="Inter, Arial, sans-serif" font-size="12">3.16 m</text>
  <line x1="510" y1="50" x2="510" y2="633" stroke="#cfc7b8" stroke-width="0.7" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="526" y="345" fill="#cfc7b8" font-family="Inter, Arial, sans-serif" font-size="12">8.33 m</text>
  <line x1="230" y1="660" x2="320" y2="660" stroke="#cfc7b8" stroke-width="0.7" marker-end="url(#arrow)" marker-start="url(#arrow)" opacity="0.75"/>
  <text x="275" y="676" text-anchor="middle" fill="#cfc7b8" font-family="Inter, Arial, sans-serif" font-size="12">1.29 m</text>
  <line x1="200" y1="508" x2="200" y2="633" stroke="#cfc7b8" stroke-width="0.7" marker-end="url(#arrow)" marker-start="url(#arrow)" opacity="0.75"/>
  <text x="180" y="575" text-anchor="middle" fill="#cfc7b8" font-family="Inter, Arial, sans-serif" font-size="12">1.79 m</text>

  <!-- Furniture shopping notes. -->
  <g transform="translate(555, 92)">
    <rect x="0" y="0" width="170" height="330" rx="8" fill="#353431" stroke="#5b574e" stroke-width="0.8"/>
    <text x="85" y="24" text-anchor="middle" fill="#f7f1e6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Alınacak ölçüler</text>
    <rect x="15" y="42" width="18" height="12" fill="#8f9085" rx="2"/>
    <text x="42" y="52" fill="#d9d0c1" font-family="Inter, Arial, sans-serif" font-size="11">Koltuk: 220-250 x 90-100</text>
    <rect x="15" y="69" width="18" height="12" fill="#6f7f55" rx="2"/>
    <text x="42" y="79" fill="#d9d0c1" font-family="Inter, Arial, sans-serif" font-size="11">Puf: 60-80 cm kare/yuvarlak</text>
    <rect x="15" y="96" width="18" height="12" fill="#b9895f" rx="2"/>
    <text x="42" y="106" fill="#d9d0c1" font-family="Inter, Arial, sans-serif" font-size="11">TV ünite: 160-200 x 30-35</text>
    <rect x="15" y="123" width="18" height="12" fill="url(#rug)" opacity="0.75" rx="2"/>
    <text x="42" y="133" fill="#d9d0c1" font-family="Inter, Arial, sans-serif" font-size="11">Halı: 160 x 230</text>
    <circle cx="24" cy="157" r="8" fill="#f0d89c" stroke="#8a7a5a" stroke-width="0.8"/>
    <text x="42" y="161" fill="#d9d0c1" font-family="Inter, Arial, sans-serif" font-size="11">Sıcak ışık: 2700-3000K</text>

    <line x1="15" y1="184" x2="155" y2="184" stroke="#5b574e"/>
    <text x="15" y="209" fill="#f7f1e6" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">Stil</text>
    <text x="15" y="230" fill="#d9d0c1" font-family="Inter, Arial, sans-serif" font-size="11">Açık meşe / ceviz ahşap</text>
    <text x="15" y="249" fill="#d9d0c1" font-family="Inter, Arial, sans-serif" font-size="11">Taş grisi kumaş koltuk</text>
    <text x="15" y="268" fill="#d9d0c1" font-family="Inter, Arial, sans-serif" font-size="11">Zeytin yeşili vurgu</text>
    <text x="15" y="287" fill="#d9d0c1" font-family="Inter, Arial, sans-serif" font-size="11">Siyah ince metal detaylar</text>
    <text x="15" y="306" fill="#d9d0c1" font-family="Inter, Arial, sans-serif" font-size="11">Kapaklı, alçak depolama</text>
  </g>

  <g transform="translate(555, 455)">
    <rect x="0" y="0" width="170" height="118" rx="8" fill="#353431" stroke="#5b574e" stroke-width="0.8"/>
    <text x="85" y="24" text-anchor="middle" fill="#f7f1e6" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">Yerleşim kontrolü</text>
    <text x="15" y="50" fill="#d9d0c1" font-family="Inter, Arial, sans-serif" font-size="11">✓ Giriş bölgesi boş bırakıldı</text>
    <text x="15" y="71" fill="#d9d0c1" font-family="Inter, Arial, sans-serif" font-size="11">✓ Koltuk-TV arası ferah</text>
    <text x="15" y="92" fill="#d9d0c1" font-family="Inter, Arial, sans-serif" font-size="11">✓ Pencere önü ağırlaşmadı</text>
  </g>
</svg>
