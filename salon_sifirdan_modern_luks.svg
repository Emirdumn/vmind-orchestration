<svg width="100%" viewBox="0 0 820 780" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Sıfırdan modern lüks salon tasarımı</title>
  <desc>3.16 x 8.33 m salon için sınırsız bütçe varsayımıyla sehpasız, modern lüks, ölçülü mobilya yerleşimi.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <pattern id="outside" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#b9b1a0" stroke-width="0.6" opacity="0.45"/>
    </pattern>
    <linearGradient id="floor" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f2eee6"/>
      <stop offset="1" stop-color="#e3dacf"/>
    </linearGradient>
    <linearGradient id="rug" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#efe6d4"/>
      <stop offset="0.48" stop-color="#cbb79d"/>
      <stop offset="1" stop-color="#6d7b5a"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <style>
      .label { font-family: Inter, Arial, sans-serif; fill: #f8f2e9; font-size: 12px; }
      .small { font-family: Inter, Arial, sans-serif; fill: #d6cbbb; font-size: 11px; }
      .dark { font-family: Inter, Arial, sans-serif; fill: #25231f; font-size: 11px; }
      .title { font-family: Inter, Arial, sans-serif; fill: #f8f2e9; font-size: 18px; font-weight: 800; }
      .panel-title { font-family: Inter, Arial, sans-serif; fill: #f8f2e9; font-size: 13px; font-weight: 800; }
      .wall { stroke: #f8f2e9; stroke-width: 5; stroke-linecap: square; }
    </style>
  </defs>

  <rect width="820" height="780" fill="#242320"/>
  <text x="410" y="31" text-anchor="middle" class="title">Sıfırdan modern lüks salon tasarımı</text>
  <text x="410" y="52" text-anchor="middle" class="small">Sehpasız lounge, gizli medya duvarı, pencere önü bank ve kesintisiz dolaşım</text>

  <!-- Salon shell. Scale: original SVG ratio, about 70 px = 1 m. -->
  <rect x="230" y="50" width="221" height="583" fill="url(#floor)" opacity="0.18"/>
  <rect x="230" y="508" width="90" height="125" fill="url(#outside)" stroke="none"/>
  <text x="275" y="558" text-anchor="middle" class="small" font-style="italic">Hol</text>
  <text x="275" y="575" text-anchor="middle" class="small" font-style="italic">salon dışı</text>

  <line x1="230" y1="50" x2="451" y2="50" class="wall"/>
  <line x1="232" y1="50" x2="449" y2="50" stroke="#2d2c29" stroke-width="1.5"/>
  <line x1="451" y1="50" x2="451" y2="633" class="wall"/>
  <line x1="320" y1="633" x2="451" y2="633" class="wall"/>
  <line x1="320" y1="508" x2="320" y2="633" stroke="#d6cbbb" stroke-width="1.5" stroke-dasharray="7,4"/>
  <line x1="230" y1="508" x2="320" y2="508" class="wall"/>
  <line x1="230" y1="50" x2="230" y2="508" class="wall"/>

  <text x="340" y="44" text-anchor="middle" class="small">Tam cephe pencere / perde rayı</text>
  <text x="372" y="575" class="small">Giriş: mobilyasız karşılama aksı</text>
  <line x1="346" y1="570" x2="368" y2="570" stroke="#d6cbbb" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Luxurious fixed architectural elements. -->
  <rect x="235" y="66" width="207" height="38" fill="#d9c9b5" stroke="#a99277" stroke-width="0.8" rx="4" filter="url(#shadow)"/>
  <text x="338.5" y="88" text-anchor="middle" class="dark" font-weight="700">Pencere önü özel bank</text>
  <text x="338.5" y="101" text-anchor="middle" class="dark">295 x 55 cm, gizli depolama</text>

  <rect x="423" y="122" width="28" height="360" fill="#453f36" stroke="#201d19" stroke-width="0.8" filter="url(#shadow)"/>
  <rect x="427" y="176" width="20" height="134" fill="#111111" rx="2"/>
  <rect x="424" y="327" width="26" height="78" fill="#8d7358" opacity="0.85" rx="2"/>
  <line x1="430" y1="416" x2="447" y2="416" stroke="#b7966e" stroke-width="2"/>
  <text x="463" y="212" class="label" font-weight="700">77&quot; OLED</text>
  <text x="463" y="230" class="small">gizli medya duvarı</text>
  <text x="463" y="246" class="small">derinlik 30 cm</text>
  <text x="463" y="264" class="small">akustik ahşap/taş panel</text>

  <rect x="233" y="130" width="9" height="330" fill="#2f312c" opacity="0.78" rx="3"/>
  <text x="246" y="151" class="small">sol duvar lineer aplik</text>
  <text x="246" y="167" class="small">ve priz hattı</text>

  <!-- Main seating: custom low modular sofa, no L requirement. -->
  <rect x="242" y="218" width="64" height="196" fill="#b8b2a7" stroke="#716a60" stroke-width="0.8" rx="9" filter="url(#shadow)"/>
  <rect x="242" y="218" width="64" height="12" fill="#8e887d" rx="8"/>
  <rect x="242" y="218" width="10" height="196" fill="#8e887d" rx="8"/>
  <line x1="262" y1="240" x2="262" y2="396" stroke="#ded9d0" stroke-width="0.8" opacity="0.7"/>
  <line x1="284" y1="240" x2="284" y2="396" stroke="#ded9d0" stroke-width="0.8" opacity="0.7"/>
  <text x="274" y="312" text-anchor="middle" class="dark" font-weight="800">Özel kanepe</text>
  <text x="274" y="328" text-anchor="middle" class="dark">280 x 92 cm</text>
  <text x="274" y="344" text-anchor="middle" class="dark">alçak, düz form</text>

  <rect x="248" y="424" width="48" height="48" fill="#6d7b5a" stroke="#34412a" stroke-width="0.8" rx="12" filter="url(#shadow)"/>
  <text x="272" y="446" text-anchor="middle" class="label" font-weight="700">Puf</text>
  <text x="272" y="461" text-anchor="middle" class="label">70 x 70</text>

  <path d="M306 209 C338 190 385 200 405 226 L405 422 C383 449 336 455 306 434 Z" fill="url(#rug)" opacity="0.56" stroke="#cdbb9e" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="356" y="300" text-anchor="middle" class="dark" font-weight="800">Organik halı</text>
  <text x="356" y="316" text-anchor="middle" class="dark">175 x 280 cm</text>
  <text x="356" y="332" text-anchor="middle" class="dark">orta sehpa yok</text>

  <!-- Loose lounge chair near window, intentionally compact. -->
  <g transform="rotate(-22, 379, 138)">
    <rect x="345" y="105" width="58" height="58" fill="#243f3a" stroke="#0e1f1c" stroke-width="0.8" rx="16" filter="url(#shadow)"/>
    <rect x="345" y="105" width="58" height="10" fill="#162b27" rx="8"/>
    <rect x="345" y="105" width="8" height="58" fill="#162b27" rx="6"/>
    <rect x="395" y="105" width="8" height="58" fill="#162b27" rx="6"/>
  </g>
  <text x="380" y="186" text-anchor="middle" class="small">Döner lounge koltuk</text>
  <text x="380" y="202" text-anchor="middle" class="small">82 x 82 cm</text>

  <!-- No coffee table: use integrated ledges only. -->
  <rect x="306" y="220" width="7" height="66" fill="#9f8464" rx="2"/>
  <rect x="306" y="350" width="7" height="66" fill="#9f8464" rx="2"/>
  <text x="315" y="232" class="small">entegre kol tabla</text>
  <text x="315" y="366" class="small">zeminde sehpa yok</text>

  <!-- Entry end: art and slim concealed storage only. -->
  <rect x="412" y="515" width="32" height="88" fill="#8d7358" opacity="0.72" stroke="#5b4633" stroke-width="0.8" rx="3" filter="url(#shadow)"/>
  <text x="456" y="546" class="small">ince konsol</text>
  <text x="456" y="562" class="small">32 cm derinlik</text>
  <text x="456" y="578" class="small">girişe taşmaz</text>
  <rect x="366" y="518" width="34" height="52" fill="#232323" stroke="#a99277" stroke-width="0.8" rx="2"/>
  <text x="352" y="593" class="small">sanat duvarı</text>

  <!-- Circulation and clearances. -->
  <rect x="311" y="118" width="88" height="398" fill="#4e8b7b" opacity="0.16" rx="5"/>
  <line x1="309" y1="450" x2="421" y2="450" stroke="#7ec1b1" stroke-width="1.2" stroke-dasharray="4,4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="365" y="444" text-anchor="middle" class="small">160 cm ferah açıklık</text>
  <line x1="322" y1="610" x2="446" y2="610" stroke="#7ec1b1" stroke-width="1.2" stroke-dasharray="4,4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="384" y="604" text-anchor="middle" class="small">girişte kesintisiz akış</text>

  <!-- Dimension guides. -->
  <line x1="230" y1="25" x2="451" y2="25" stroke="#d6cbbb" stroke-width="0.7" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="340" y="20" text-anchor="middle" class="small">3.16 m</text>
  <line x1="520" y1="50" x2="520" y2="633" stroke="#d6cbbb" stroke-width="0.7" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="536" y="345" class="small">8.33 m</text>
  <line x1="230" y1="660" x2="320" y2="660" stroke="#d6cbbb" stroke-width="0.7" marker-end="url(#arrow)" marker-start="url(#arrow)" opacity="0.75"/>
  <text x="275" y="676" text-anchor="middle" class="small">1.29 m</text>
  <line x1="200" y1="508" x2="200" y2="633" stroke="#d6cbbb" stroke-width="0.7" marker-end="url(#arrow)" marker-start="url(#arrow)" opacity="0.75"/>
  <text x="180" y="575" text-anchor="middle" class="small">1.79 m</text>

  <!-- Design notes. -->
  <g transform="translate(575, 88)">
    <rect x="0" y="0" width="210" height="356" rx="10" fill="#34322e" stroke="#635b50" stroke-width="0.8"/>
    <text x="105" y="26" text-anchor="middle" class="panel-title">Nihai mobilya reçetesi</text>
    <text x="16" y="58" class="small">1. Özel kanepe: 270-285 x 90-95 cm</text>
    <text x="16" y="82" class="small">2. Medya duvarı: 180-220 cm hat</text>
    <text x="16" y="106" class="small">3. TV: 65-77&quot;, duvara gömülü görünüm</text>
    <text x="16" y="130" class="small">4. Pencere bankı: 280-300 x 50-55 cm</text>
    <text x="16" y="154" class="small">5. Lounge koltuk: 80-85 cm döner</text>
    <text x="16" y="178" class="small">6. Puf: 65-75 cm, hareketli</text>
    <text x="16" y="202" class="small">7. Halı: 170-180 x 260-280 cm</text>
    <text x="16" y="226" class="small">8. Orta sehpa: kullanılmaz</text>

    <line x1="16" y1="247" x2="194" y2="247" stroke="#635b50"/>
    <text x="16" y="276" class="panel-title">Malzeme dili</text>
    <text x="16" y="301" class="small">traverten / mikro beton</text>
    <text x="16" y="322" class="small">ceviz ya da füme meşe kaplama</text>
    <text x="16" y="343" class="small">taş rengi bukle kumaş + zeytin vurgu</text>
  </g>

  <g transform="translate(575, 476)">
    <rect x="0" y="0" width="210" height="145" rx="10" fill="#34322e" stroke="#635b50" stroke-width="0.8"/>
    <text x="105" y="26" text-anchor="middle" class="panel-title">Neden bu en optimal?</text>
    <text x="16" y="55" class="small">Dar eni kalabalıklaştırmıyor.</text>
    <text x="16" y="78" class="small">Sehpasız merkez daha lüks ve ferah.</text>
    <text x="16" y="101" class="small">Elektrik iki tarafta dekoratif ışığa yarıyor.</text>
    <text x="16" y="124" class="small">Giriş, pencere ve TV aksı çakışmıyor.</text>
  </g>

  <g transform="translate(575, 646)">
    <rect x="0" y="0" width="210" height="72" rx="10" fill="#6d7b5a" opacity="0.92" stroke="#9aa77c" stroke-width="0.8"/>
    <text x="105" y="27" text-anchor="middle" class="panel-title">Ana fikir</text>
    <text x="105" y="50" text-anchor="middle" class="label">butik otel lounge hissi</text>
  </g>
</svg>
