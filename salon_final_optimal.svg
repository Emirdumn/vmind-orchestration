<svg width="100%" viewBox="0 0 820 780" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Final optimal salon yerleşimi</title>
  <desc>3.16 x 8.33 m salon için pufsuz, sehpasız, büyük ana koltuklu, tekli koltuklu ve lambaderli modern yerleşim.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <pattern id="outside" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#b9b1a0" stroke-width="0.6" opacity="0.45"/>
    </pattern>
    <linearGradient id="floor" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f4efe6"/>
      <stop offset="1" stop-color="#dfd4c8"/>
    </linearGradient>
    <linearGradient id="rug" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#efe5d2"/>
      <stop offset="0.48" stop-color="#c9b69d"/>
      <stop offset="1" stop-color="#6f7f55"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <style>
      .label { font-family: Inter, Arial, sans-serif; fill: #f8f2e9; font-size: 12px; }
      .small { font-family: Inter, Arial, sans-serif; fill: #d6cbbb; font-size: 11px; }
      .dark { font-family: Inter, Arial, sans-serif; fill: #25231f; font-size: 11px; }
      .title { font-family: Inter, Arial, sans-serif; fill: #f8f2e9; font-size: 18px; font-weight: 800; }
      .panel-title { font-family: Inter, Arial, sans-serif; fill: #f8f2e9; font-size: 13px; font-weight: 800; }
      .wall { stroke: #f8f2e9; stroke-width: 5; stroke-linecap: square; }
    </style>
  </defs>

  <rect width="820" height="780" fill="#242320"/>
  <text x="410" y="31" text-anchor="middle" class="title">Final optimal salon yerleşimi</text>
  <text x="410" y="52" text-anchor="middle" class="small">Pufsuz ve sehpasız: maksimum ana koltuk, tekli lounge koltuk, lambader, gizli medya duvarı</text>

  <!-- Fixed shell. Existing scale preserved: about 70 px = 1 m. -->
  <rect x="230" y="50" width="221" height="583" fill="url(#floor)" opacity="0.18"/>
  <rect x="230" y="508" width="90" height="125" fill="url(#outside)" stroke="none"/>
  <text x="275" y="558" text-anchor="middle" class="small" font-style="italic">Hol</text>
  <text x="275" y="575" text-anchor="middle" class="small" font-style="italic">salon dışı</text>

  <line x1="230" y1="50" x2="451" y2="50" class="wall"/>
  <line x1="232" y1="50" x2="449" y2="50" stroke="#2d2c29" stroke-width="1.5"/>
  <line x1="451" y1="50" x2="451" y2="633" class="wall"/>
  <line x1="320" y1="633" x2="451" y2="633" class="wall"/>
  <line x1="320" y1="508" x2="320" y2="633" stroke="#d6cbbb" stroke-width="1.5" stroke-dasharray="7,4"/>
  <line x1="230" y1="508" x2="320" y2="508" class="wall"/>
  <line x1="230" y1="50" x2="230" y2="508" class="wall"/>

  <text x="340" y="44" text-anchor="middle" class="small">Pencere / perde rayı</text>
  <text x="372" y="575" class="small">Giriş: açık bırakıldı</text>
  <line x1="346" y1="570" x2="368" y2="570" stroke="#d6cbbb" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Window-side built-in bench. -->
  <rect x="235" y="66" width="207" height="36" fill="#d9c9b5" stroke="#a99277" stroke-width="0.8" rx="4" filter="url(#shadow)"/>
  <text x="338.5" y="88" text-anchor="middle" class="dark" font-weight="700">Pencere önü ince bank</text>
  <text x="338.5" y="100" text-anchor="middle" class="dark">295 x 52 cm, depolamalı</text>

  <!-- Media wall on right long wall. -->
  <rect x="423" y="134" width="28" height="350" fill="#443d34" stroke="#201d19" stroke-width="0.8" filter="url(#shadow)"/>
  <rect x="427" y="184" width="20" height="130" fill="#111111" rx="2"/>
  <rect x="424" y="331" width="26" height="78" fill="#8d7358" opacity="0.85" rx="2"/>
  <text x="463" y="216" class="label" font-weight="700">65-77&quot; TV</text>
  <text x="463" y="234" class="small">gizli medya duvarı</text>
  <text x="463" y="250" class="small">30 cm derinlik</text>
  <text x="463" y="266" class="small">ceviz / taş panel</text>

  <!-- Maximum optimal sofa: straight custom low sofa, not L, to protect circulation. -->
  <rect x="236" y="205" width="68" height="214" fill="#b8b2a7" stroke="#716a60" stroke-width="0.8" rx="10" filter="url(#shadow)"/>
  <rect x="236" y="205" width="68" height="12" fill="#8e887d" rx="8"/>
  <rect x="236" y="205" width="10" height="214" fill="#8e887d" rx="8"/>
  <line x1="254" y1="231" x2="254" y2="399" stroke="#ded9d0" stroke-width="0.8" opacity="0.7"/>
  <line x1="274" y1="231" x2="274" y2="399" stroke="#ded9d0" stroke-width="0.8" opacity="0.7"/>
  <line x1="292" y1="231" x2="292" y2="399" stroke="#ded9d0" stroke-width="0.8" opacity="0.7"/>
  <text x="270" y="306" text-anchor="middle" class="dark" font-weight="800">Ana koltuk</text>
  <text x="270" y="322" text-anchor="middle" class="dark">305 x 95 cm</text>
  <text x="270" y="338" text-anchor="middle" class="dark">4 kişilik özel kanepe</text>

  <!-- No coffee table or pouf: central comfort rug only. -->
  <path d="M310 202 C340 184 386 195 407 225 L407 430 C383 459 337 462 310 438 Z" fill="url(#rug)" opacity="0.58" stroke="#cdbb9e" stroke-width="0.8" filter="url(#shadow)"/>
  <text x="358" y="304" text-anchor="middle" class="dark" font-weight="800">Organik halı</text>
  <text x="358" y="320" text-anchor="middle" class="dark">180 x 285 cm</text>
  <text x="358" y="336" text-anchor="middle" class="dark">sehpa ve puf yok</text>

  <!-- One required single chair. -->
  <g transform="rotate(-18, 380, 142)">
    <rect x="345" y="107" width="66" height="66" fill="#243f3a" stroke="#0e1f1c" stroke-width="0.8" rx="18" filter="url(#shadow)"/>
    <rect x="345" y="107" width="66" height="11" fill="#162b27" rx="8"/>
    <rect x="345" y="107" width="9" height="66" fill="#162b27" rx="6"/>
    <rect x="402" y="107" width="9" height="66" fill="#162b27" rx="6"/>
  </g>
  <text x="383" y="194" text-anchor="middle" class="small">Tekli lounge koltuk</text>
  <text x="383" y="210" text-anchor="middle" class="small">90 x 90 cm</text>

  <!-- Required floor lamp, placed on the lounge axis near the single chair and window. -->
  <circle cx="316" cy="143" r="16" fill="#f0d89c" stroke="#8a7a5a" stroke-width="0.8" filter="url(#shadow)"/>
  <circle cx="316" cy="143" r="3.2" fill="#3a3a3a"/>
  <line x1="316" y1="159" x2="316" y2="192" stroke="#242320" stroke-width="2"/>
  <circle cx="316" cy="196" r="5" fill="#242320"/>
  <text x="303" y="172" text-anchor="end" class="small">Lambader</text>
  <text x="303" y="188" text-anchor="end" class="small">zorunlu</text>

  <!-- Integrated surfaces instead of free furniture. -->
  <rect x="306" y="240" width="8" height="74" fill="#9f8464" rx="2"/>
  <rect x="306" y="346" width="8" height="74" fill="#9f8464" rx="2"/>
  <text x="318" y="254" class="small">koltuk yanı entegre tabla</text>
  <text x="318" y="370" class="small">ortada mobilya yok</text>

  <!-- Entry-side slim art/storage, kept shallow. -->
  <rect x="414" y="515" width="30" height="88" fill="#8d7358" opacity="0.72" stroke="#5b4633" stroke-width="0.8" rx="3" filter="url(#shadow)"/>
  <text x="456" y="548" class="small">ince konsol</text>
  <text x="456" y="564" class="small">30 cm derinlik</text>
  <rect x="366" y="518" width="34" height="52" fill="#232323" stroke="#a99277" stroke-width="0.8" rx="2"/>
  <text x="352" y="593" class="small">sanat duvarı</text>

  <!-- Clearance guides. -->
  <rect x="312" y="118" width="88" height="398" fill="#4e8b7b" opacity="0.16" rx="5"/>
  <line x1="308" y1="452" x2="421" y2="452" stroke="#7ec1b1" stroke-width="1.2" stroke-dasharray="4,4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="365" y="446" text-anchor="middle" class="small">160 cm civarı ferah açıklık</text>
  <line x1="322" y1="610" x2="446" y2="610" stroke="#7ec1b1" stroke-width="1.2" stroke-dasharray="4,4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="384" y="604" text-anchor="middle" class="small">girişte kesintisiz akış</text>

  <!-- Dimensions. -->
  <line x1="230" y1="25" x2="451" y2="25" stroke="#d6cbbb" stroke-width="0.7" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="340" y="20" text-anchor="middle" class="small">3.16 m</text>
  <line x1="520" y1="50" x2="520" y2="633" stroke="#d6cbbb" stroke-width="0.7" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="536" y="345" class="small">8.33 m</text>
  <line x1="230" y1="660" x2="320" y2="660" stroke="#d6cbbb" stroke-width="0.7" marker-end="url(#arrow)" marker-start="url(#arrow)" opacity="0.75"/>
  <text x="275" y="676" text-anchor="middle" class="small">1.29 m</text>
  <line x1="200" y1="508" x2="200" y2="633" stroke="#d6cbbb" stroke-width="0.7" marker-end="url(#arrow)" marker-start="url(#arrow)" opacity="0.75"/>
  <text x="180" y="575" text-anchor="middle" class="small">1.79 m</text>

  <g transform="translate(575, 88)">
    <rect x="0" y="0" width="210" height="364" rx="10" fill="#34322e" stroke="#635b50" stroke-width="0.8"/>
    <text x="105" y="26" text-anchor="middle" class="panel-title">Final reçete</text>
    <text x="16" y="58" class="small">1. Ana koltuk: 300-305 x 92-95 cm</text>
    <text x="16" y="82" class="small">2. Tekli koltuk: 88-92 x 88-92 cm</text>
    <text x="16" y="106" class="small">3. Lambader: tekli koltuk aksında</text>
    <text x="16" y="130" class="small">4. TV: 65-77&quot;, sağ duvarda</text>
    <text x="16" y="154" class="small">5. Medya duvarı: 180-220 cm</text>
    <text x="16" y="178" class="small">6. Halı: 180 x 280-290 cm</text>
    <text x="16" y="202" class="small">7. Bank: 280-300 x 50-55 cm</text>
    <text x="16" y="226" class="small">8. Puf yok, orta sehpa yok</text>

    <line x1="16" y1="248" x2="194" y2="248" stroke="#635b50"/>
    <text x="16" y="278" class="panel-title">Koltuk kararı</text>
    <text x="16" y="304" class="small">L yerine düz özel kanepe seçildi.</text>
    <text x="16" y="325" class="small">Sebep: oda eni 3.16 m; L form</text>
    <text x="16" y="346" class="small">geçişi ve ferahlığı zayıflatır.</text>
  </g>

  <g transform="translate(575, 486)">
    <rect x="0" y="0" width="210" height="144" rx="10" fill="#34322e" stroke="#635b50" stroke-width="0.8"/>
    <text x="105" y="26" text-anchor="middle" class="panel-title">Modern lüks etki</text>
    <text x="16" y="56" class="small">Taş rengi bukle kumaş</text>
    <text x="16" y="79" class="small">Füme meşe / ceviz medya duvarı</text>
    <text x="16" y="102" class="small">Zeytin yeşili tekli koltuk</text>
    <text x="16" y="125" class="small">2700K sıcak, katmanlı ışık</text>
  </g>

  <g transform="translate(575, 654)">
    <rect x="0" y="0" width="210" height="66" rx="10" fill="#6f7f55" opacity="0.92" stroke="#9aa77c" stroke-width="0.8"/>
    <text x="105" y="27" text-anchor="middle" class="panel-title">Ana fikir</text>
    <text x="105" y="50" text-anchor="middle" class="label">maksimum koltuk + boş merkez</text>
  </g>
</svg>
